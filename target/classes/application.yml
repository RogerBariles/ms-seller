spring:
  application:
    name: pos-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_pasteleria
    username: pos
    password: pos123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: pos-pasteleria-jwt-secret-change-in-production-32chars-min
    expiration-ms: 28800000
  cors:
    allowed-origins: http://localhost:4200
