spring:
  application:
    name: pos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pos_pasteleria}
    username: ${SPRING_DATASOURCE_USERNAME:pos}
    password: ${SPRING_DATASOURCE_PASSWORD:pos123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    secret: ${APP_JWT_SECRET:pos-pasteleria-jwt-secret-change-in-production-32chars-min}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
